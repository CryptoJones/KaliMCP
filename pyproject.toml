[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kalimcp"
version = "0.2.0"
description = "MCP server exposing a curated subset of Kali Linux security tools to an AI agent. Refuse-list guard + audit log on every invocation."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
  { name = "Aaron K. Clark", email = "akclark@thenetwerk.net" },
]
keywords = ["mcp", "security", "pentest", "kali", "claude", "agent-tools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Information Technology",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
  "mcp>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/CryptoJones/KaliMCP"
Repository = "https://github.com/CryptoJones/KaliMCP"
Mirror = "https://codeberg.org/CryptoJones/KaliMCP"
Issues = "https://github.com/CryptoJones/KaliMCP/issues"
"Nebraska Footer" = "https://xkcd.com/2347/"

[project.scripts]
kalimcp = "kalimcp.server:main"
kalimcp-authz = "kalimcp.authz_cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "pytest-asyncio>=0.23",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kalimcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
