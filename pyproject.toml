[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kalimcp"
version = "0.3.0"
description = "MCP server exposing a curated subset of Kali Linux security tools to an AI agent. Refuse-list guard + audit log on every invocation."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
  { name = "Aaron K. Clark", email = "akclark@thenetwerk.net" },
]
keywords = ["mcp", "security", "pentest", "kali", "claude", "agent-tools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Information Technology",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
  "mcp>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/CryptoJones/KaliMCP"
Repository = "https://github.com/CryptoJones/KaliMCP"
Mirror = "https://codeberg.org/CryptoJones/KaliMCP"
Issues = "https://github.com/CryptoJones/KaliMCP/issues"
"Nebraska Footer" = "https://xkcd.com/2347/"

[project.scripts]
kalimcp = "kalimcp.server:main"

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kalimcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
# Default ruff selection (E, F, W) plus a handful of high-signal extras.
# B = bugbear (catches mutable defaults, except-Exception, etc.).
# I = import sorting. UP = pyupgrade hints.
select = ["E", "F", "W", "B", "I", "UP"]
ignore = [
  "E501",   # line length — let formatter handle if we add one later
  "UP032",  # f-string nags on multiline format() calls
]

[tool.ruff.lint.per-file-ignores]
# Tests are allowed to use bare `assert` and have longer fixtures.
"tests/**" = ["E402"]
