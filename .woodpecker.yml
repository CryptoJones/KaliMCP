when:
  - event: [push, pull_request]
    branch: main

steps:
  lint:
    image: python:3.12-slim
    commands:
      - pip install -e '.[dev]'
      - ruff check src/ tests/
      - mypy

  audit:
    image: python:3.12-slim
    commands:
      - pip install -e '.[dev]'
      - pip-audit

  secret-scan:
    image: alpine:3.20
    commands:
      # Mirror the GitHub Actions gitleaks job. Pinned binary so the scan
      # is reproducible; --no-git scans the working tree (no dependency on
      # a full clone). Non-zero exit on any finding fails the pipeline.
      - apk add --no-cache curl tar
      - curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | tar -xz gitleaks
      - ./gitleaks detect --no-git --source . --redact --exit-code 1 -v

  sbom:
    image: alpine:3.20
    commands:
      # syft — same CycloneDX SBOM the GitHub Actions anchore/sbom-action job ships.
      - apk add --no-cache curl
      - curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin v1.18.1
      - syft dir:. -o cyclonedx-json=kalimcp-sbom.cyclonedx.json -o table

  dockerfile-lint:
    image: hadolint/hadolint:latest-debian
    commands:
      - hadolint Dockerfile

  test-3-11:
    image: python:3.11-slim
    commands:
      - pip install -e '.[dev]'
      - pytest -v

  test-3-12:
    image: python:3.12-slim
    commands:
      - pip install -e '.[dev]'
      - pytest -v
