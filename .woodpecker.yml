when:
  - event: [push, pull_request]
    branch: main

steps:
  lint:
    image: python:3.12-slim
    commands:
      - pip install -e '.[dev]'
      - ruff check src/ tests/
      - mypy

  audit:
    image: python:3.12-slim
    commands:
      - pip install -e '.[dev]'
      - pip-audit

  dockerfile-lint:
    image: hadolint/hadolint:latest-debian
    commands:
      - hadolint Dockerfile

  test-3-11:
    image: python:3.11-slim
    commands:
      - pip install -e '.[dev]'
      - pytest -v

  test-3-12:
    image: python:3.12-slim
    commands:
      - pip install -e '.[dev]'
      - pytest -v
